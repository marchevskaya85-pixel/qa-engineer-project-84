---
- summary: |
    Невозможно выполнить поиск товара по названию
  environment: |
    URL: https://products-store.hexlet.app/
    ОС: Windows 11 Version 26H2 (Build 26300.9974)
    Браузер: Google Chrome 157.0.8103.40 (64-bit)
  steps-to-reproduce: |
    Вводим название товара "Яблоко" в поле "Поиск"
    Нажимаем клавишу Enter
  expected-result: |
    Открывается страница с товарами, соответствующими поисковому запросу "Яблоко"
  actual-result: |
    Открывается страница с сообщением "Ничего не найдено!"
    Ошибка изображена на скриншоте assets/search-by-name-bug.png

- summary: |
    Поле фильтра по цене позволяет ввести отрицательное значение
  environment: |
    URL: https://products-store.hexlet.app/
    ОС: Windows 11 Version 26H2 (Build 26300.9974)
    Браузер: Google Chrome 157.0.8103.40 (64-bit)
  steps-to-reproduce: |
    В поле фильтра цены вводим значение -1
    Подтверждаем ввод
  expected-result: |
    Ввод отрицательного значения отклоняется или выводится уведомление о некорректном вводе цены
  actual-result: |
    Поле принимает отрицательное значение -1 без ошибок валидации, и выполняется фильтрация товаров в заданном диапазоне цен
    Ошибка изображена на скриншоте assets/negative-price-bug.png

- summary: |
    Отсутствует отображение рейтинга товаров на главной странице
  environment: |
    URL: https://products-store.hexlet.app/
    ОС: Windows 11 Version 26H2 (Build 26300.9974)
    Браузер: Google Chrome 157.0.8103.40 (64-bit)
  steps-to-reproduce: |
    Просматриваем информацию к случайному товару на главной странице
  expected-result: |
    В описании на главной странице товара отображается числовое значение, обозначающее рейтинг товара
  actual-result: |
    На главной странице в описании товара отсутствует рейтинг товара

- summary: |
    Отсутствует переход на страницу заказа и оплаты при оформлении заказа из корзины
  environment: |
    URL: https://products-store.hexlet.app/
    ОС: Windows 11 Version 26H2 (Build 26300.9974)
    Браузер: Google Chrome 157.0.8103.40 (64-bit)
  steps-to-reproduce: |
    Нажимаем кнопку оформления заказа ("Проверить") в корзине
  expected-result: |
    Открывается страница с информацией о заказе, перечнем заказываемых товаров, их количеством, стоимостью, общей суммой заказа и ссылкой на оплату
  actual-result: |
   Открывается модальное окно "Заказ успешно оформлен." с перечнем товаров и суммой заказа, но переход на страницу заказа и оплаты не выполняется
    Ошибка изображена на скриншоте assets/order-placement-bug.png
    
- summary: |
    Невозможно переключить язык интерфейса на английский
  environment: |
    URL: https://products-store.hexlet.app/
    ОС: Windows 11 Version 26H2 (Build 26300.9974)
    Браузер: Google Chrome 157.0.8103.40 (64-bit)
  steps-to-reproduce: |
    Открываем выпадающий список выбора языка в шапке сайта
    Выбираем пункт "Английский"
  expected-result: |
    Элементы интерфейса магазина переводятся на английский язык
  actual-result: |
    Элементы интерфейса остаются без изменения, отображаются на русском языке


