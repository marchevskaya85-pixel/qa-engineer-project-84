functional:
 - Пользователь должен иметь возможность искать товары по ключевому слову или категории
 - Пользователь должен иметь возможность фильтровать товары
 - Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
 - Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
 - Пользователь должен иметь возможность переключить язык интерфейса
non-functional:
 - Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
 - Сайт должен быть безопасным и защищать данные пользователя
 - Сайт должен иметь мобильную версию
 - Сайт нужно протестировать на совместимость с последними версиями браузеров
 - Важно, чтобы сайт мог обрабатывать большое количество трафика
 - Сайт должен быть доступен на различных устройствах
 - Сайт должен иметь локализацию (перевод) на русский и английский языки
 - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
implicit:
 - В корзине должна отображаться итоговая сумма заказа
 - Пользователь должен иметь возможность зарегистрироваться на сайте, указать контактную информацию
 - Пользователь должен иметь возможность выбрать способ доставки товара
 - Пользователь должен иметь возможность указать адрес доставки товара
 - Пользователь должен иметь возможность выбрать способ оплаты товара
 - Пользователь должен иметь возможность оплатить товар
 - Пользователь должен иметь возмжность изменить количество товаров в корзине
 - Пользователь должен иметь возможность оформить свой заказ
 - Пользователь должен получать информацию о текущем состоянии заказа
 - Пользователь должен иметь возможность удалить товар из корзины
 - Пользователь должен иметь возможно отменить заказ
 - Итоговая сумма заказа должна автоматически изменяться при корректировке состава заказа
 - Пользователь должен иметь возможность сбросить все установленные фильтры
 - Пользователь должен иметь возможность отключать и включать фильтры
 - Пользователь должен иметь возможность вернуться на Главную страницу магазина из любого места сайта
