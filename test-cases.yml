---
- summary: |
    Успешный поиск товара по названию
  requirement: |
    При вводе названия товара, должна открыться страница с этим товаром
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    "название товара: Яблоко"
  steps:
    - Вводим название товара "Яблоко" в поле "Поиск"
    - Нажимаем подтверждение действия Enter
  expected-result: |
    Пользователь должен попасть на страницу с товарами, соответстующими поисковому запросу "Яблоко"

- summary: |
    Успешная фильтрация товара по категории
  requirement: |
    При выборе категории, открывается страница с товарами, относящимися к данной категорие
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    "Название категории: красоста"
  steps:
    - Выбираем из раскрывающегося списка в поле "Категрия" группу "красота"
  expected-result: |
    Пользователь должен попасть на страницу с товарами, относящимися к данной категрии
