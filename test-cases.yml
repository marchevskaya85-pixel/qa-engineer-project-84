---
- summary: |
    Успешный поиск товара по названию
  requirement: |
    При вводе названия товара должна открыться страница с этим товаром
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    Название товара: Яблоко
  steps:
    - Вводим название товара "Яблоко" в поле "Поиск"
    - Нажимаем клавишу Enter
  expected-result: |
    Открывается страница с товарами, соответствующими поисковому запросу "Яблоко"

- summary: |
    Успешная фильтрация товара по категории
  requirement: |
    При выборе категории открывается страница с товарами, относящимися к данной категории
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    Название категории: красота
  steps:
    - Выбираем из раскрывающегося списка в поле "Категория" группу "красота"
  expected-result: |
    Открывается страница с товарами, относящимися к данной категории

- summary: |
    Отклонение ввода отрицательного значения в поле фильтрации цен
  requirement: |
    При вводе отрицательного значения в поле фильтра цены блокируется ввод значений, начинающихся со знака -, либо выводится сообщение об ошибке
  prerequisites: |
    - Загружена главная страница магазина
    - Курсор установлен в поле фильтра цены
  test-data: |
    Значение цены: -1
  steps:
    - В поле фильтра цены вводим значение -1
    - Подтверждаем ввод
  expected-result: |
    Ввод отрицательного значения отклоняется или выводится уведомление о некорректном вводе цены

- summary: |
    Успешный просмотр подробной информации о товаре
  requirement: |
    При выборе товара открывается карточка с подробной информацией
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    Не требуются
  steps:
    - Кликаем на главной странице магазина на наименование случайного товара
  expected-result: |
    Открывается страница с карточкой товара, в которой указана подробная информация о нем

- summary: |
    Отображение рейтинга товара на главной странице магазина
  requirement: |
    Информация о товаре на главной странице магазина содержит значение рейтинга товара
  prerequisites: |
    Загружена главная страница магазина
  test-data: |
    Не требуются
  steps:
    - Просматриваем информацию к случайному товару на главной странице
  expected-result: |
    На главной странице в описании товара отображается числовое значение, обозначающее рейтинг товара

- summary: |
    Успешное оформление заказа из корзины
  requirement: |
    В корзине есть возможность сформировать из списка выбранных товаров заказ для оплаты
  prerequisites: |
    - В корзине лежат выбранные случайные товары
    - Пользователь находится на странице корзины
  test-data: |
    Не требуются
  steps:
    - Переходим к оформлению заказа из корзины
  expected-result: |
    Открывается страница с информацией о заказе, перечнем заказываемых товаров, их количеством, стоимостью, общей суммой заказа и ссылкой на оплату

- summary: |
    Успешное добавление товаров в корзину
  requirement: |
    Нажатие кнопки "Добавить в корзину" помещает выбранный товар в корзину и увеличивает значение счетчика
  prerequisites: |
    Пользователь находится на странице каталога товаров
  test-data: |
    Не требуются
  steps:
    - Выбираем случайный товар из каталога
    - Нажимаем на кнопку "Добавить в корзину"
  expected-result: |
    Товар добавляется в корзину, а счетчик товаров в корзине увеличивается на 1

- summary: |
    Успешное переключение языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Загружена главная страница магазина на русском языке
  test-data: |
    Язык интерфейса: Английский
  steps:
    - Открываем выпадающий список выбора языка в шапке сайта
    - Выбираем пункт "Английский"
  expected-result: |
    Элементы интерфейса магазина переводятся на английский язык
