 bugreports:
  - summary: |
      Невозможно открыть карточку товара по клику на его название на главной странице
    environment: |
      URL: https://products-store-v2.hexlet.app/
      ОС: Windows 11 Version 26H2 (Build 26300.9974)
      Браузер: Google Chrome 157.0.8103.40 (64-bit) 
    steps-to-reproduce: |
      Открываем главную страницу магазина
      Кликаем на название любого товара в каталоге
    expected-result: |
      Открывается страница с подробной карточкой выбранного товара
    actual-result: |
      Переход на страницу товара не происходит, т.к. к названию товара не привязана ссылка на карточку, кликабельным осталось только изображение товара

 - summary: |
      Фильтр по цене игнорирует ввод отрицательного значения в поле верхней границы («До»)
    environment: |
      URL: https://products-store-v2.hexlet.app/
      ОС: Windows 11 Version 26H2 (Build 26300.9974)
      Браузер: Google Chrome 157.0.8103.40 (64-bit) 
    steps-to-reproduce: |
      Открываем главную страницу магазина
      Вводим отрицательное значение -5 в поле фильтра цены «До»
      Подтверждаем ввод
    expected-result: |
      Ввод отрицательного значения отклоняется или выводится уведомление о некорректном вводе цены
    actual-result: |
      Поле принимает отрицательное значение -5 без ошибок валидации, фильтрация не применяется и в каталоге остаются все товары
